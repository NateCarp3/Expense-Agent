<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Agent · Sign in</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f3;color:#0b0b0b}
@media (prefers-color-scheme:dark){body{background:#121211;color:#f0efec}.card{background:#1a1a19!important;border-color:#2f2f2c!important}input{background:#121211!important;border-color:#2f2f2c!important;color:inherit}}
.card{background:#fcfcfb;border:1px solid #e4e3df;border-radius:14px;padding:28px;width:320px}
.logo{width:34px;height:34px;border-radius:9px;background:#2a78d6;color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:12px}
h1{font-size:18px;margin:0 0 16px}
input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #e4e3df;border-radius:8px;font:inherit;margin-bottom:12px}
button{width:100%;padding:9px;border:0;border-radius:8px;background:#2a78d6;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:#d03b3b;margin-bottom:10px}
</style>
</head>
<body>
<form class="card" method="post">
  <div class="logo">$</div>
  <h1>Expense Agent</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
